services:
  rabbit:
    image: rabbitmq:4.3.6-management
    hostname: interview-rabbit
    ports:
      - "127.0.0.1:5672:5672"
    volumes:
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 128
    stop_grace_period: 5s
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
