<figure class="architecture" aria-labelledby="architecture-title">
<figcaption id="architecture-title">双链路一览：索引供检索使用，原始系统保留事实与权限的最终权威。</figcaption>
<div class="architecture-grid">
<section aria-label="离线与增量链路"><h4>01 / 离线与增量</h4><ol class="flow"><li>原始资料</li><li>解析、质量检查与结构分块</li><li>写入来源、版本、权限元数据</li><li>生成向量与词项索引</li><li>校验 → 切换可用索引版本</li></ol></section>
<section aria-label="在线问答链路"><h4>02 / 在线问答</h4><ol class="flow"><li>问题 + 服务端确认的身份</li><li>意图、时间范围与权限约束</li><li><strong>关键词 / 向量召回</strong><small>未经授权原文不进入模型</small><small>← 读取已校验的可用索引</small></li><li>融合去重 → 重排<small>只处理已经召回的候选</small></li><li>证据组织与 token 预算</li><li>生成带引用回答 → 支持关系检查</li></ol></section>
</div>
<div class="diagram-exits"><strong>显式出口</strong><br>证据充分 → 回答　·　问题不清 → 澄清　·　无证据 / 版本冲突 → 明确不足<br>权限失效 → 拒绝越权访问　·　预算耗尽 → 受控停止或降级</div>
<div class="diagram-exits"><strong>两层独立评测：检索满分 ≠ 回答正确</strong><br>检索层：证据有没有找到、是否靠前？Recall@k / MRR / nDCG<br>回答层：是否正确完整、证据是否支持主张？事实覆盖 / 有据主张 / 引用支持</div>
<p class="diagram-observability">贯穿全链：请求与版本标识、阶段耗时、错误与必要上下文。日志同样受权限与留存策略约束。</p>
</figure>
