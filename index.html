<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Java 后端面试手册：算法手撕、代码与 SQL 手撕、场景设计、八股问答、AI 应用、Java 语法与面试策略，支持自测、掌握度标记与全文搜索。">
  <title>学习笔记</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231d2433'/%3E%3Cpath d='M22 20 12 32l10 12M42 20l10 12-10 12M36 16l-8 32' fill='none' stroke='%23fff' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <script>
    // 首帧前确定主题与字号，避免闪烁
    try {
      var t = localStorage.getItem('iv8-theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      var f = localStorage.getItem('iv8-font');
      if (f) document.documentElement.dataset.font = f;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="./assets/styles/main.css">
  <link rel="stylesheet" href="./assets/styles/loading.css">
  <link rel="stylesheet" href="./assets/styles/reading-layout.css">
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <button type="button" class="icon-btn nav-toggle" id="nav-toggle" aria-label="打开目录" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <a class="brand" href="#/" aria-label="回到冲刺台">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 7 3 12l5 5M16 7l5 5-5 5M14 4l-4 16"/></svg></span>
        <span class="brand-text"><strong>学习笔记</strong></span>
      </a>
      <nav class="modnav" id="modnav" aria-label="模块"></nav>
      <div class="top-actions">
        <a href="project/" title="项目展示：生产事件可靠触达与智能维修闭环" style="display:inline-flex;align-items:center;height:34px;padding:0 12px;border:1px solid var(--accent-line);border-radius:8px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:14px;text-decoration:none;white-space:nowrap">项目</a>
        <button type="button" class="search-trigger" id="search-trigger" aria-label="全文搜索">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <span>搜索题目、八股、知识点</span><kbd>Ctrl K</kbd>
        </button>
        <button type="button" class="icon-btn" id="font-btn" aria-label="调整字号" title="字号">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19 9 5l5 14M5.8 14h6.4M15 19l3-8 3 8M15.9 16.5h4.2"/></svg>
        </button>
        <button type="button" class="icon-btn" id="theme-btn" aria-label="切换深浅色" title="深浅色">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
        </button>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar" id="sidebar" aria-label="目录">
        <div class="side-head" id="side-head"></div>
        <div class="side-filter">
          <input id="side-search" type="search" placeholder="筛选本模块…" aria-label="筛选本模块" autocomplete="off">
          <div class="seg seg-sm" id="status-filter" role="group" aria-label="按掌握度筛选">
            <button type="button" data-f="" class="on">全部</button>
            <button type="button" data-f="0">未学</button>
            <button type="button" data-f="1">模糊</button>
            <button type="button" data-f="2">掌握</button>
          </div>
        </div>
        <nav class="side-list" id="side-list"></nav>
        <div class="side-foot"><kbd>J</kbd><kbd>K</kbd> 上下题 · <kbd>/</kbd> 搜索 · <kbd>F</kbd> 专注</div>
      </aside>
      <div class="scrim" id="scrim" hidden></div>

      <main class="main" id="main">
        <article class="page" id="page" aria-live="polite"></article>
      </main>

      <aside class="rail" id="rail" aria-label="本页目录"></aside>
    </div>
  </div>

  <div class="palette" id="palette" hidden role="dialog" aria-modal="true" aria-label="全文搜索">
    <div class="palette-box">
      <div class="palette-input">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="palette-q" type="search" placeholder="搜题名、题号、八股问题、关键词… 空格分隔多个词" autocomplete="off" aria-label="搜索">
        <kbd>Esc</kbd>
      </div>
      <div class="palette-scope" id="palette-scope"></div>
      <div class="palette-list" id="palette-list" role="listbox"></div>
      <div class="palette-foot"><span><kbd>↑</kbd><kbd>↓</kbd> 选择</span><span><kbd>Enter</kbd> 打开</span><span id="palette-count"></span></div>
    </div>
  </div>

  <div class="popover" id="font-pop" hidden>
    <div class="seg" role="group" aria-label="字号">
      <button type="button" data-font="sm">小</button>
      <button type="button" data-font="">标准</button>
      <button type="button" data-font="lg">大</button>
      <button type="button" data-font="xl">特大</button>
    </div>
  </div>
  <div class="toast" id="toast" hidden></div>

  <script type="module" src="./assets/runtime/bootstrap.js"></script>
</body>
</html>
